<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer - Acid Edition</title>
    <style>
        /* --- STILI BASE --- */
        body { 
            margin: 0; padding: 0; 
            background: #050505; 
            overflow: hidden; 
            font-family: 'Courier New', monospace; 
            color: #ccc; 
        }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* --- UI PANNELLO DESTRO --- */
        #ui-panel {
            position: absolute; top: 15px; right: 15px; z-index: 100;
            background: rgba(10, 10, 10, 0.9); 
            border: 1px solid #444;
            padding: 20px;
            width: 240px;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
        }

        /* --- UI PANNELLO SINISTRO --- */
        #commands-panel {
            position: absolute; bottom: 15px; left: 15px; z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            /* COLORE AGGIORNATO: #ccff00 */
            border-left: 3px solid #ccff00;
            padding: 10px 15px;
            font-size: 11px;
            pointer-events: none;
            color: #aaa;
            line-height: 1.8;
        }
        #commands-panel span { color: #fff; font-weight: bold; margin-right: 5px; }
        /* COLORE AGGIORNATO */
        #commands-panel b { color: #ccff00; }

        /* --- ELEMENTI FORM --- */
        label { font-size: 10px; font-weight: bold; color: #888; text-transform: uppercase; display: block; margin-bottom: 5px; }
        
        select, button {
            background: #000; color: #fff; border: 1px solid #333; padding: 10px; width: 100%;
            font-family: inherit; font-size: 12px; font-weight: bold; cursor: pointer; outline: none;
            transition: all 0.2s;
        }
        /* HOVER: Giallino */
        select:hover, button:hover { border-color: #ccff00; color: #ccff00; }
        /* ACTIVE: Sfondo Giallino, testo nero */
        button.active { background: #ccff00; color: #000; border-color: #ccff00; }
        
        /* Flex row per slider e bottoni */
        .control-row { display: flex; gap: 10px; align-items: center; }

        /* --- SLIDER CUSTOM --- */
        .slider-container {
            position: relative; width: 100%; height: 30px; display: flex; align-items: center;
        }
        input[type=range] { 
            width: 100%; 
            accent-color: #ccff00; /* COLORE AGGIORNATO */
            cursor: pointer; z-index: 2; position: relative; background: transparent;
        }

        /* Pallino magnetico */
        .slider-notch {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; background-color: #666; border-radius: 50%;
            z-index: 1; pointer-events: none; transition: background 0.2s;
        }
        .slider-notch.active { 
            background-color: #ccff00; /* COLORE AGGIORNATO */
            box-shadow: 0 0 5px #ccff00; 
            width: 8px; height: 8px; 
        }

        /* Loading Overlay */
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 200;
            display: flex; align-items: center; justify-content: center;
            color: #ccff00; /* COLORE AGGIORNATO */
            font-size: 18px; letter-spacing: 2px;
            flex-direction: column;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading">
        <div>SYSTEM INITIALIZING...</div>
        <div style="font-size: 12px; color: #666; margin-top: 10px;">Reading: 1.jpg, 2.mtl, 3.obj</div>
    </div>

    <div id="commands-panel">
        <div><span>RUOTA:</span> <b>1 Dito</b> / Click Sx</div>
        <div><span>SPOSTA:</span> <b>2 Dita</b> / Click Dx</div>
        <div><span>ZOOM:</span> <b>Pinch</b> / Scroll</div>
    </div>

    <div id="ui-panel">
        
        <div>
            <label>Modalità</label>
            <select id="mode-select">
                <option value="-1" selected>RENDER 3D NORMALE</option>
                <option value="ascii">ASCII ART</option>
            </select>
        </div>

        <div style="border-top: 1px solid #333; padding-top: 10px;">
            <label>Animazione</label>
            <div class="control-row">
                <button id="btn-rotate" style="flex: 1;">RUOTA: OFF</button>
            </div>
            <div style="margin-top: 8px;">
                <label style="color: #666; font-size: 9px;">Velocità</label>
                <input type="range" id="speed-slider" min="0.5" max="10.0" step="0.5" value="2.0">
            </div>
        </div>

        <div id="ascii-controls" style="display: none; border-top: 1px solid #333; padding-top: 10px;">
            <label>Stile Ascii</label>
            <select id="style-select">
                <option value="0">Standard</option>
                <option value="1">Dense</option>
                <option value="2">Minimal</option>
                <option value="3">Blocks</option>
                <option value="4">Braille</option>
                <option value="5">Technical</option>
                <option value="6">Matrix</option>
                <option value="7">Hatching</option>
            </select>
            
            <div style="margin-top: 10px;">
                <label>Definizione</label>
                <select id="pixel-select">
                    <option value="4" selected>Ultra (4px)</option>
                    <option value="6">High (6px)</option>
                    <option value="8">Medium (8px)</option>
                    <option value="12">Retro (12px)</option>
                </select>
            </div>
        </div>

        <div style="border-top: 1px solid #333; padding-top: 10px;">
            <label>Luminosità</label>
            <div class="slider-container">
                <input type="range" id="brightness-slider" min="0.0" max="2.0" step="0.02" value="1.0">
                <div id="slider-notch" class="slider-notch active"></div>
            </div>
        </div>

        <button id="btn-color" class="active" style="margin-top: 5px;">COLORE: ON</button>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // --- SHADER UNIFICATO ---
        const UniversalShader = {
            uniforms: {
                'tDiffuse': { value: null },
                'resolution': { value: new THREE.Vector2() },
                'cellSize': { value: 4.0 }, 
                'style': { value: -1 }, 
                'time': { value: 0.0 },
                'isColor': { value: 1.0 },
                'brightness': { value: 1.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform vec2 resolution;
                uniform float cellSize;
                uniform int style; 
                uniform float time;
                uniform float isColor;
                uniform float brightness;
                varying vec2 vUv;

                float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }

                float getChar(float b, vec2 p, int style) {
                    vec2 grid = floor(p * 4.0); float val = 0.0;
                    if (style==0) { if(b>0.8)val=1.0; else if(b>0.6)val=(grid.x>0.0&&grid.y>0.0)?1.0:0.0; else if(b>0.4)val=(mod(grid.x+grid.y,2.0)==0.0)?1.0:0.0; else if(b>0.2)val=(grid.x==2.0&&grid.y==2.0)?1.0:0.0; }
                    else if (style==1) { if(b>0.95)val=1.0; else if(b>0.8)val=(grid.x>0.0||grid.y>0.0)?1.0:0.0; else if(b>0.6)val=(mod(grid.x,2.0)==0.0||mod(grid.y,2.0)==0.0)?1.0:0.0; else if(b>0.4)val=(grid.x==grid.y)?1.0:0.0; else if(b>0.2)val=(grid.x==2.0&&grid.y==2.0)?1.0:0.0; }
                    else if (style==2) { float dist=distance(fract(p),vec2(0.5)); if(b>0.5)val=step(dist,0.4); else if(b>0.2)val=step(dist,0.15); }
                    else if (style==3) { if(b>0.9)val=1.0; else if(b>0.65)val=0.75; else if(b>0.4)val=0.50; else if(b>0.15)val=0.25; }
                    else if (style==4) { if(b>0.8)val=(mod(grid.x,2.0)==0.0&&mod(grid.y,2.0)==0.0)?1.0:0.0; else if(b>0.4)val=(grid.x==2.0&&grid.y==2.0)?1.0:0.0; }
                    else if (style==5) { float noise=step(0.5,fract(sin(dot(grid,vec2(12.9,78.2)))*43758.5)); val=(b>0.1)?noise:0.0; }
                    else if (style==6) { float rain=sin(p.y*10.0+time*8.0+random(vec2(floor(p.x*10.0),0.0))*20.0); if(b>0.15)val=step(0.4,rain)*b; }
                    else if (style==7) { if(b>0.8)val=1.0; else if(b>0.6)val=step(0.5,fract(p.x+p.y)); else if(b>0.4)val=step(0.5,fract(p.x)); else if(b>0.2)val=step(0.9,fract(p.x-p.y)); }
                    return val;
                }

                void main() {
                    if (style == -1) { // Normal
                        vec3 rgb = texture2D(tDiffuse, vUv).rgb * brightness; 
                        if (isColor < 0.5) {
                            float luma = dot(rgb, vec3(0.299, 0.587, 0.114));
                            gl_FragColor = vec4(vec3(luma), 1.0);
                        } else { gl_FragColor = vec4(rgb, 1.0); }
                        return;
                    }
                    // Ascii
                    vec2 pixelRatio = resolution / cellSize;
                    vec2 cellUV = (floor(vUv * pixelRatio) + 0.5) / pixelRatio;
                    vec3 rgb = texture2D(tDiffuse, cellUV).rgb * brightness;
                    float luma = min(dot(rgb, vec3(0.299, 0.587, 0.114)), 1.0);
                    float charShape = getChar(luma, fract(vUv * pixelRatio), style);
                    vec3 finalColor = (isColor > 0.5) ? rgb * charShape : vec3(luma) * charShape;
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        };

        const FILES = { tex: '1.jpg', mtl: '2.mtl', obj: '3.obj' };
        let camera, scene, renderer, composer, uniPass;
        let controls;
        let config = { isAsciiMode: false };

        init();
        
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 2, 12);
            scene.add(camera);

            // --- SET LUCI ---
            // Luce ambientale di base
            scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.2));
            
            // Luce direzionale laterale
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 15, 10);
            scene.add(dirLight);
            
            // Torcia camera
            camera.add(new THREE.PointLight(0xffffff, 0.6));

            // *** LUCE SOFFUSA DALL'ALTO ***
            const topLight = new THREE.DirectionalLight(0xfff0e0, 0.7);
            topLight.position.set(0, 20, 0); 
            topLight.target.position.set(0,0,0);
            scene.add(topLight);
            scene.add(topLight.target);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));

            uniPass = new ShaderPass(UniversalShader);
            uniPass.uniforms['resolution'].value.set(window.innerWidth, window.innerHeight);
            composer.addPass(uniPass);

            loadAssets();

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false;
            controls.autoRotateSpeed = 2.0;

            setupInterface();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function loadAssets() {
            const mtlLoader = new MTLLoader();
            mtlLoader.load(FILES.mtl, (materials) => {
                materials.preload();
                const objLoader = new OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.load(FILES.obj, (object) => {
                    const texLoader = new THREE.TextureLoader();
                    texLoader.load(FILES.tex, (tex) => {
                        tex.colorSpace = THREE.SRGBColorSpace;
                        object.traverse((child) => {
                            if (child.isMesh) {
                                child.material.map = tex;
                                child.material.emissiveMap = tex;
                                child.material.emissive = new THREE.Color(0x333333);
                                child.material.needsUpdate = true;
                            }
                        });
                        finalizeLoad(object);
                    }, undefined, () => finalizeLoad(object));
                });
            });
        }

        function finalizeLoad(object) {
            const box = new THREE.Box3().setFromObject(object);
            object.position.sub(box.getCenter(new THREE.Vector3())); 
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            
            // ZOOM ANCORA PIÙ ESTREMO (0.4x)
            camera.position.z = maxDim * 0.4; 
            
            scene.add(object);
            document.getElementById('loading').style.display = 'none';
        }

        function setupInterface() {
            // --- MODE SWITCH ---
            const modeSelect = document.getElementById('mode-select');
            const asciiGroup = document.getElementById('ascii-controls');
            modeSelect.addEventListener('change', (e) => {
                if (e.target.value === 'ascii') {
                    config.isAsciiMode = true;
                    uniPass.uniforms['style'].value = parseInt(document.getElementById('style-select').value);
                    asciiGroup.style.display = 'block';
                } else {
                    config.isAsciiMode = false;
                    uniPass.uniforms['style'].value = -1;
                    asciiGroup.style.display = 'none';
                }
            });

            // --- ANIMATION CONTROLS ---
            const btnRotate = document.getElementById('btn-rotate');
            const speedSlider = document.getElementById('speed-slider');
            
            btnRotate.addEventListener('click', () => {
                controls.autoRotate = !controls.autoRotate;
                if (controls.autoRotate) {
                    btnRotate.innerText = "RUOTA: ON";
                    btnRotate.classList.add('active');
                } else {
                    btnRotate.innerText = "RUOTA: OFF";
                    btnRotate.classList.remove('active');
                }
            });

            speedSlider.addEventListener('input', (e) => {
                controls.autoRotateSpeed = parseFloat(e.target.value);
            });

            // --- ASCII CONTROLS ---
            document.getElementById('style-select').addEventListener('change', (e) => {
                if(config.isAsciiMode) uniPass.uniforms['style'].value = parseInt(e.target.value);
            });
            document.getElementById('pixel-select').addEventListener('change', (e) => {
                uniPass.uniforms['cellSize'].value = parseFloat(e.target.value);
            });

            // --- COLOR & BRIGHTNESS ---
            const btnColor = document.getElementById('btn-color');
            btnColor.addEventListener('click', () => {
                const isColor = (uniPass.uniforms['isColor'].value > 0.5);
                uniPass.uniforms['isColor'].value = isColor ? 0.0 : 1.0;
                btnColor.innerText = isColor ? "COLORE: OFF (B/N)" : "COLORE: ON";
                btnColor.classList.toggle('active');
            });

            const brSlider = document.getElementById('brightness-slider');
            const notch = document.getElementById('slider-notch');
            brSlider.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                if (val > 0.92 && val < 1.08) { // Magnetic zone
                    val = 1.0;
                    e.target.value = 1.0;
                    notch.classList.add('active');
                } else {
                    notch.classList.remove('active');
                }
                uniPass.uniforms['brightness'].value = val;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            uniPass.uniforms['resolution'].value.set(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Gestisce anche autoRotate
            uniPass.uniforms['time'].value += 0.05;
            composer.render();
        }
    </script>
</body>
</html>
